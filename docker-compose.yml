version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: smartpdf_user
      POSTGRES_PASSWORD: smartpdf_password
      POSTGRES_DB: smartpdf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
